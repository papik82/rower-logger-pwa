<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12181B">
<title>Rower Logger — Ustawienia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css?v=28">
</head>
<body>

<header>
  <h1>Ustawienia</h1>
</header>

<nav class="nav-menu">
  <a class="nav-tile" data-page="index.html" href="index.html">
    <span class="nav-icon">🚴</span>
    <span class="nav-label">Trening</span>
  </a>
  <a class="nav-tile" data-page="analiza.html" href="analiza.html">
    <span class="nav-icon">📊</span>
    <span class="nav-label">Analizy</span>
  </a>
  <a class="nav-tile" data-page="wyniki.html" href="wyniki.html">
    <span class="nav-icon">📋</span>

  </a>
  <a class="nav-tile" data-page="ustawienia.html" href="ustawienia.html">
    <span class="nav-icon">⚙️</span>
    <span class="nav-label">Ustawienia</span>
  </a>
</nav>

<main>
  <div class="stat-card settings-field">
    <label for="appsScriptUrl">Adres Google Apps Script</label>
    <input type="url" id="appsScriptUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
  </div>

  <div class="stat-card settings-field">
    <label for="maxHr">Tętno maksymalne (bpm)</label>
    <input type="number" id="maxHr" placeholder="np. 185" min="1" inputmode="numeric">
  </div>

  <p id="settingsStatus" class="settings-status"></p>

  <button class="hr-connect-btn" id="saveSettingsBtn">Zapisz ustawienia</button>
  <button class="secondary" id="forceUpdateBtn">Wymuś aktualizację aplikacji</button>
</main>

<script src="nav.js?v=28"></script>
<script src="ustawienia.js?v=28"></script>
</body>
</html>
